<!doctype html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tungaahui Digital Book</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#f8f7f5;color:#17245b}
body:before,body:after{content:"";position:fixed;border:3px solid rgba(238,35,45,.08);border-radius:50%;pointer-events:none}
body:before{width:760px;height:760px;right:-250px;top:-230px;box-shadow:0 0 0 35px rgba(238,35,45,.04),0 0 0 70px rgba(238,35,45,.035),0 0 0 105px rgba(238,35,45,.03),0 0 0 140px rgba(238,35,45,.025)}
body:after{width:500px;height:500px;left:-250px;bottom:-250px;box-shadow:0 0 0 35px rgba(23,36,91,.035),0 0 0 70px rgba(23,36,91,.03),0 0 0 105px rgba(23,36,91,.025)}
header{text-align:center;height:92px;padding-top:24px;position:relative;z-index:2}
.kicker{font-size:10px;letter-spacing:5px;color:#6f7690;margin-bottom:7px}
.title{font-size:25px;letter-spacing:4px;font-weight:500}.title b{color:#ed1c24}
#stage{position:absolute;left:0;right:0;top:92px;bottom:74px;display:flex;align-items:center;justify-content:center;z-index:1}
#book{width:min(82vw,1260px);height:min(72vh,700px);position:relative}
.page{background:#fff;overflow:hidden}.page canvas{width:100%;height:100%;display:block}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#70758a}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid #ddd;border-radius:50%;background:rgba(255,255,255,.9);color:#17245b;font-size:22px;cursor:pointer;z-index:4}
.nav:hover{background:#fff}.prev{left:3%}.next{right:3%}
footer{position:fixed;bottom:18px;left:0;right:0;height:38px;display:flex;justify-content:center;align-items:center;gap:18px;z-index:5}
#info{font-size:13px;font-weight:600;letter-spacing:1px}.full{border:1px solid #d4d4d4;border-radius:22px;background:rgba(255,255,255,.9);padding:9px 17px;color:#17245b;cursor:pointer}
.credit{position:fixed;right:18px;bottom:12px;font-size:9px;letter-spacing:2px;color:#999;z-index:5}
@media(max-width:700px){
 header{height:75px;padding-top:17px}.kicker{font-size:8px;letter-spacing:3px}.title{font-size:17px;letter-spacing:2px}
 #stage{top:75px;bottom:65px}#book{width:90vw;height:72vh}.nav{width:38px;height:38px;font-size:18px}.prev{left:2%}.next{right:2%}
 footer{bottom:8px}.credit{display:none}
}
</style>
</head>
<body>
<header><div class="kicker">ТУНГААХУЙ ӨГӨГДЛИЙН УРЛАН</div><div class="title">ТАНЫ ХУВИЙН МЭДЭЭЛЭЛ — <b>ТАНЫ ӨМЧ</b></div></header>
<div id="stage"><div id="book"><div id="loading">Номыг ачаалж байна…</div></div></div>
<button class="nav prev" aria-label="Previous">‹</button><button class="nav next" aria-label="Next">›</button>
<footer><span id="info">Хуудас 1 / …</span><button class="full" id="fullscreen">⛶&nbsp; Бүтэн дэлгэц</button></footer>
<div class="credit">© ТУНГААХУЙ</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
const PDF="./Redbook2.pdf", book=document.querySelector("#book"), loading=document.querySelector("#loading"), info=document.querySelector("#info");
try{
 const pdf=await pdfjsLib.getDocument(PDF).promise;
 const first=await pdf.getPage(1), vp=first.getViewport({scale:1});
 const width=Math.min(630,Math.max(300,innerWidth*.42)), height=width*(vp.height/vp.width);
 const flip=new St.PageFlip(book,{width,height,size:"stretch",minWidth:280,maxWidth:900,minHeight:380,maxHeight:1200,showCover:true,useMouseEvents:true,mobileScrollSupport:false,maxShadowOpacity:.25});
 const pages=[];
 for(let i=1;i<=pdf.numPages;i++){
   const p=await pdf.getPage(i), v=p.getViewport({scale:1.45});
   const c=document.createElement("canvas"); c.width=v.width;c.height=v.height;
   await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;
   const d=document.createElement("div");d.className="page";d.appendChild(c);pages.push(d);
 }
 flip.loadFromHTML(pages);loading.remove();
 const update=()=>info.textContent=`Хуудас ${flip.getCurrentPageIndex()+1} / ${pdf.numPages}`;
 flip.on("flip",update);update();
 document.querySelector(".prev").onclick=()=>flip.flipPrev();
 document.querySelector(".next").onclick=()=>flip.flipNext();
 document.querySelector("#fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
}catch(e){loading.textContent="Ном ачаалахад алдаа гарлаа. Redbook2.pdf файл repository-д байгаа эсэхийг шалгана уу.";console.error(e)}
</script>
</body>
</html>
